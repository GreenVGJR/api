<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checking Browser</title>
</head>
<style>html{background-color:#000000;}</style>
<body>
    <script>(async()=>{const n={{BACK_CHALLENGE_COOKIE}},m={{BACK_CHALLENGE_MAX_AGE}},s={{BACK_CHALLENGE_SECURE}},r=new Uint8Array({{BACK_CHALLENGE_VALUE}}),v=JSON.parse(await new Response(new Blob([r]).stream().pipeThrough(new DecompressionStream('gzip'))).text()),h=()=>document.cookie.split(';').some(p=>p.trim().startsWith(`${n}=`));document.cookie=`${n}=${encodeURIComponent(v.map(x=>atob(x).slice(-2)).join(''))}; Max-Age=${m}; Path=/; SameSite=Lax${s?'; Secure':''}`;h()?setTimeout(()=>location.replace(location.href),50):document.body.textContent='Cookie challenge failed. Enable cookies and refresh this page.';})();</script>
    <noscript>Enable JavaScript and refresh this page.</noscript>
</body>
</html>
